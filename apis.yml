aid: genentech
name: Genentech
description: >-
  Genentech is a biotechnology company founded in 1976 and headquartered in
  South San Francisco, California, and a member of the Roche Group since 2009.
  It discovers, develops, manufactures, and commercializes medicines across
  oncology, immunology, ophthalmology, neuroscience, infectious disease, and
  rare disease. For developers and health-system integration partners,
  Genentech operates a public Developer Portal (developer.gene.com) and an
  Integration Marketplace that exposes FHIR R4 "Universal API" (UAPI) services
  for Patient Support Services — including Access Solutions patient enrollment,
  Copay program enrollment, Patient Foundation enrollment, and status query
  services. Access is registration-based with API keys and an OAuth2 / OpenID
  Connect authorization surface. Genentech also maintains a large open-source
  GitHub organization (github.com/Genentech, 150+ repositories) focused on
  computational biology, genomics, and AI/ML for drug discovery.
